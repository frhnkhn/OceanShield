version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: oceanshield_db
    environment:
      POSTGRES_DB: oceanshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanshield_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@database:5432/oceanshield
    depends_on:
      - database
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oceanshield_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
